version: "3.8"

services:
  coder-docker:
    image: lscr.io/linuxserver/code-server:latest
    container_name: coder-docker
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1001
      - TZ=Asia/Shanghai
    volumes:
      - "${TRIM_APPDEST}:/config/.target:rw"  # 映射到容器内
      - "${TRIM_PKGETC}:/config/.config/code-server"  # 配置文件路径
      - "/vol1/1000/VscodeProject:/config/workspace"  # 项目路径
      - "/var/apps/coder-docker/cmd/custom:/custom-services.d"  # 映射到容器内
    network_mode: bridge