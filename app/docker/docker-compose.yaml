version: "3.8"

services:
  coder-docker:
    image: codercom/code-server:latest
    container_name: coder-docker
    restart: unless-stopped
    volumes:
      - "${TRIM_APPDEST}:/home/coder/target:rw"  # 容器内的工作目录
      - "${TRIM_PKGETC}:/home/coder/.config/code-server"  # 配置文件路径
      - "/vol1/1000/VscodeProject:/home/coder/project"  # 项目路径
    user: "1000:1000"
    environment:
      - PASSWORD=password
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1001
    entrypoint: ["/bin/sh", "-c"]
    command: /home/coder/target/proxy/code-proxy 
    network_mode: bridge
