version: "3.8"

services:
  coder-docker:
    image: codercom/code-server:latest
    container_name: coder-docker
    restart: unless-stopped
    volumes:
      - "${TRIM_APPDEST}:/home/coder/.target:rw"  # 容器内的工作目录
      - "${TRIM_PKGETC}:/home/coder/.config/code-server"  # 配置文件路径
      - "${wizard_work_path}:/home/coder/project"  # 项目路径
    user: "1000:1000"
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1001
    entrypoint: []
    command: ["/home/coder/.target/proxy/coder-proxy-linux-amd64"]
    network_mode: bridge
